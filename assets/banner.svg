<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Gradient for Text & Accents -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(-1.5deg); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.05); opacity: 0.7; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes shimmer {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
    .floating-card-2 { animation: float2 7s ease-in-out infinite 1s; transform-origin: center; }
    .floating-card-3 { animation: float1 8s ease-in-out infinite 2s; transform-origin: center; }
    .floating-card-4 { animation: float2 6.5s ease-in-out infinite 0.5s; transform-origin: center; }

    .pulsing-orb-1 { animation: pulseRing 5s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseRing 7s ease-in-out infinite 1s; transform-origin: 1000px 300px; }

    .animated-dash { stroke-dasharray: 8 6; animation: dash 20s linear infinite; }
    .rotating-gear { animation: spinSlow 30s linear infinite; transform-origin: 1100px 70px; }

    .banner-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .banner-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="420" rx="20" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="90" r="180" fill="#38bdf8" fill-opacity="0.08" filter="url(#softGlow)" class="pulsing-orb-1" />
  <circle cx="1020" cy="320" r="220" fill="#a855f7" fill-opacity="0.1" filter="url(#softGlow)" class="pulsing-orb-2" />
  <circle cx="600" cy="200" r="150" fill="#6366f1" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- Decorative Rotating Cyber Ring in Background Top Right -->
  <g class="rotating-gear" opacity="0.15">
    <circle cx="1100" cy="70" r="120" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="12 8" />
    <circle cx="1100" cy="70" r="90" fill="none" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="1100" cy="70" r="60" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6 4" />
  </g>

  <!-- Network Connection Animated Lines -->
  <g stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 150 210 Q 300 120 450 210 T 750 210 T 1050 210" class="animated-dash" />
    <path d="M 200 320 Q 500 390 800 320" stroke="#a855f7" stroke-opacity="0.2" class="animated-dash" />
  </g>

  <!-- Ecosystem Network Nodes -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="150" cy="210" r="4" filter="url(#glow)" />
    <circle cx="300" cy="165" r="3" />
    <circle cx="450" cy="210" r="4" filter="url(#glow)" />
    <circle cx="600" cy="255" r="3" />
    <circle cx="750" cy="210" r="4" filter="url(#glow)" />
    <circle cx="900" cy="165" r="3" />
    <circle cx="1050" cy="210" r="4" filter="url(#glow)" />
  </g>

  <!-- Header Badge / Pill -->
  <g transform="translate(425, 42)">
    <rect width="350" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="banner-text" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
      K-12 &amp; HIGHER-ED DIGITAL SIS ECOSYSTEM
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 128)" text-anchor="middle">
    <!-- Icon above Title -->
    <g transform="translate(-24, -58)">
      <!-- Grad Cap Icon with Glow -->
      <path d="M24 4 L2 15 L24 26 L46 15 Z" fill="url(#accentGrad)" filter="url(#glow)" />
      <path d="M10 21.5 V32 C10 36 38 36 38 32 V21.5" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <path d="M40 19 V31 C40 33 42 34 42 34" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" />
    </g>

    <text class="banner-title" font-size="44" fill="url(#textGrad)" letter-spacing="-0.5" filter="url(#glow)">
      Awesome School Management
    </text>
    <text y="38" class="banner-text" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.3">
      The Complete Directory of SIS, School ERP, LMS &amp; Educational Operations
    </text>
  </g>

  <!-- Feature Cards (Floating Grid) -->
  <!-- Card 1: SIS / Student Info -->
  <g class="floating-card-1" transform="translate(90, 240)">
    <rect width="230" height="110" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" filter="url(#glow)" />
    <!-- Icon -->
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.5" />
      <!-- User / ID Card Icon -->
      <path d="M20 14 A 5 5 0 1 0 20 24 A 5 5 0 1 0 20 14 Z M12 30 C12 26 15.5 24 20 24 C24.5 24 28 26 28 30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    </g>
    <text x="74" y="44" class="banner-title" font-size="15" fill="#f8fafc">Student Info (SIS)</text>
    <text x="74" y="64" class="banner-text" font-size="11" fill="#94a3b8">Admissions &amp; Records</text>
    <text x="74" y="79" class="banner-text" font-size="11" fill="#94a3b8">Attendance &amp; Grading</text>
    <circle cx="206" cy="22" r="4" fill="#38bdf8" />
  </g>

  <!-- Card 2: ERP & Finance -->
  <g class="floating-card-2" transform="translate(350, 240)">
    <rect width="230" height="110" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.2" />
    <!-- Icon -->
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#7e22ce" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.5" />
      <!-- Building / ERP Icon -->
      <path d="M13 30 V16 L20 12 L27 16 V30 M17 20 H23 M17 24 H23 M20 30 V26" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="74" y="44" class="banner-title" font-size="15" fill="#f8fafc">School ERP</text>
    <text x="74" y="64" class="banner-text" font-size="11" fill="#94a3b8">Fee Collection &amp; Payroll</text>
    <text x="74" y="79" class="banner-text" font-size="11" fill="#94a3b8">HR, Assets &amp; Transport</text>
    <circle cx="206" cy="22" r="4" fill="#c084fc" />
  </g>

  <!-- Card 3: LMS & Virtual Classrooms -->
  <g class="floating-card-3" transform="translate(610, 240)">
    <rect width="230" height="110" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
    <!-- Icon -->
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#047857" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.5" />
      <!-- Book / Video Icon -->
      <path d="M12 16 L20 13 L28 16 V28 L20 25 L12 28 Z M20 13 V25" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="74" y="44" class="banner-title" font-size="15" fill="#f8fafc">LMS &amp; Classrooms</text>
    <text x="74" y="64" class="banner-text" font-size="11" fill="#94a3b8">Online Courses &amp; Exams</text>
    <text x="74" y="79" class="banner-text" font-size="11" fill="#94a3b8">Video Conferencing</text>
    <circle cx="206" cy="22" r="4" fill="#34d399" />
  </g>

  <!-- Card 4: Open Source & Analytics -->
  <g class="floating-card-4" transform="translate(870, 240)">
    <rect width="230" height="110" rx="14" fill="url(#cardGrad)" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.2" />
    <!-- Icon -->
    <g transform="translate(20, 22)">
      <rect width="40" height="40" rx="10" fill="#b45309" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.5" />
      <!-- Chart Icon -->
      <path d="M13 28 V22 M20 28 V14 M27 28 V18" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="74" y="44" class="banner-title" font-size="15" fill="#f8fafc">Analytics &amp; BI</text>
    <text x="74" y="64" class="banner-text" font-size="11" fill="#94a3b8">District Dashboards</text>
    <text x="74" y="79" class="banner-text" font-size="11" fill="#94a3b8">Open-Source &amp; SaaS</text>
    <circle cx="206" cy="22" r="4" fill="#fbbf24" />
  </g>

  <!-- Bottom Accent Shimmer Line -->
  <rect x="100" y="385" width="1000" height="2" rx="1" fill="url(#textGrad)" opacity="0.7" />
  
  <!-- Footer Tech Stack Pills -->
  <g transform="translate(600, 396)" text-anchor="middle">
    <text class="banner-text" font-size="11" font-weight="500" fill="#64748b" letter-spacing="1">
      POWERED BY COMMUNITY • OPEN-SOURCE &amp; ENTERPRISE SAAS SOFTWARE
    </text>
  </g>
</svg>
